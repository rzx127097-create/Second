[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "problem2-sr-mappo"
version = "0.1.0"
description = "Deterministic foundation for the SR-MAPPO thesis second problem."
requires-python = ">=3.11,<3.12"
dependencies = [
  "networkx>=3.6,<3.7",
  "numpy>=2.4,<2.5",
  "pyproj>=3.7,<3.8",
  "PyYAML>=6.0,<7",
  "shapely>=2.1,<2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10"]
rl = ["torch>=2.13,<2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
