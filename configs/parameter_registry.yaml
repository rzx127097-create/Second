    meaning: "rated onboard pesticide capacity of one UAV"
    value: 1.0
    unit: L
    min: 0.1
    max: 5.0
    source_type: manual
    source_id: "DJI-T40-official-spec"
    source_value: 40.0
    source_unit: L
    conversion: "value = source_value * 0.025 scene_liquid_scale"
    status: provisional
    scope: main
