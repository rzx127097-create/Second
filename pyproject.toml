[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "problem2-sr-mappo"
version = "0.1.0"
description = "Road-constrained air-ground cooperative spraying framework for the SR-MAPPO thesis problem."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
marl = ["torch>=2.0"]
rl = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
