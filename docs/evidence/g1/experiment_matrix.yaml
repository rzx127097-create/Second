schema_version: g1.v1
registry_id: G1-EXPERIMENT-MATRIX
status: design_frozen
methods:
  - sr_mappo_mobile
  - sr_mappo_fixed
  - sr_mappo_astar
  - mappo_mobile
  - sr_mappo_two_stage
scales:
  g20x20_d2:
    max_physical_decision_steps: 150
  g20x30_d3:
    max_physical_decision_steps: 180
  g20x40_d3:
    max_physical_decision_steps: 220
  g30x30_d3:
    max_physical_decision_steps: 220
  g30x40_d4:
    max_physical_decision_steps: 280
  g30x50_d4:
    max_physical_decision_steps: 350
metrics:
  - {name: reduction_rate, type: number, unit: "1", category: primary_outcome}
  - {name: success_at_0_85, type: boolean, unit: "1", category: primary_outcome}
  - {name: request_count, type: integer, unit: count, category: service}
  - {name: request_completed_count, type: integer, unit: count, category: service}
  - {name: rendezvous_distance_m, type: number, unit: m, category: mechanism}
  - {name: waiting_steps, type: integer, unit: step, category: mechanism}
  - {name: pesticide_disabled_steps, type: integer, unit: step, category: mechanism}
  - {name: return_steps, type: integer, unit: step, category: mechanism}
  - {name: effective_spray_steps, type: integer, unit: step, category: mechanism}
  - {name: transferred_pesticide_l, type: number, unit: L, category: mechanism}
  - {name: vehicle_travel_steps, type: integer, unit: step, category: operational}
  - {name: vehicle_idle_steps, type: integer, unit: step, category: operational}
  - {name: vehicle_stranded_inventory_l, type: number, unit: L, category: operational}
  - {name: decision_runtime_s, type: number, unit: s, category: operational}
  - {name: initial_uav_pesticide_l, type: number, unit: L, category: resource}
  - {name: final_uav_pesticide_l, type: number, unit: L, category: resource}
  - {name: initial_vehicle_inventory_l, type: number, unit: L, category: resource}
  - {name: final_vehicle_inventory_l, type: number, unit: L, category: resource}
  - {name: requested_pesticide_l, type: number, unit: L, category: resource}
  - {name: sprayed_pesticide_l, type: number, unit: L, category: resource}
  - {name: total_available_supply_l, type: number, unit: L, category: resource}
evaluation:
  primary_outcomes:
    - reduction_rate
    - success_at_0_85
  mechanism_metrics:
    - rendezvous_distance_m
    - waiting_steps
    - pesticide_disabled_steps
    - return_steps
    - effective_spray_steps
    - transferred_pesticide_l
  operational_metrics:
    - request_count
    - request_completed_count
    - vehicle_travel_steps
    - vehicle_idle_steps
    - vehicle_stranded_inventory_l
    - decision_runtime_s
  resource_metrics:
    - initial_uav_pesticide_l
    - final_uav_pesticide_l
    - initial_vehicle_inventory_l
    - final_vehicle_inventory_l
    - requested_pesticide_l
    - sprayed_pesticide_l
    - total_available_supply_l
  success_threshold:
    metric: reduction_rate
    value: 0.85
  training_reward_is_diagnostic_only: true
protocol:
  fairness:
    equal_environment: true
    equal_total_pesticide: true
    equal_initial_vehicle_inventory: true
    equal_transfer_rate: true
    equal_service_cap: true
    equal_setup_service_time: true
    equal_training_seed_protocol: true
    equal_evaluation_scenario_ids: true
    equal_horizon: true
    equal_information_conditions: true
    equal_evaluation_budget: true
  exception_status: none_frozen
  resource_replenishment: pesticide_only
  battery_replenishment: inactive
