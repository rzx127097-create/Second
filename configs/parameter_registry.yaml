status: provisional
note: >-
  Simulation values are provisional. The UAV records carry explicit DJI T40
  source metadata and scene-scale conversions. Three ground-support records
  now carry public product reference ranges and explicit scene-scale
  conversions, but they still require a vehicle-match or timed field test.
  Records marked assumption remain blocking for formal evidence. Do not use
  this registry as formal experimental evidence until status is verified.
parameters:
