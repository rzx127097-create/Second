status: provisional
note: >-
  Values are frozen for the declared controlled-simulation scope. The UAV
  records carry DJI T40 metadata and explicit scene-scale conversions; three
  ground-support records carry public product reference ranges. Records marked
  assumption are auditable simulation choices and require sensitivity analysis.
  They are not field-validated constants and cannot support deployment claims.
parameters:
  uav_onboard_pesticide:
    symbol: q_i_max
    meaning: "rated onboard pesticide capacity of one UAV"
    value: 1.0
    unit: L
    min: 0.1
    max: 5.0
    source_type: manual
    source_id: "DJI-T40-official-spec"
    source_value: 40.0
    source_unit: L
    conversion: "value = source_value * 0.025 scene_liquid_scale"
    status: provisional
    scope: main
  uav_spray_flow:
    symbol: rho_i_spr
    meaning: "UAV spray liquid flow rate"
    value: 0.01
    unit: L/s
    min: 0.001
    max: 0.1
    source_type: manual
    source_id: "DJI-T40-official-spec"
    source_value: 0.2
    source_unit: L/s
    conversion: "value = source_value * 0.05 scene_flow_scale"
    status: provisional
    scope: main
  uav_usable_fraction:
    symbol: eta_i_use
    meaning: "usable fraction of rated onboard pesticide capacity"
    value: 0.8
    unit: "1"
    min: 0.5
    max: 1.0
    source_type: assumption
    source_id: "pending-equipment-or-field-source"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-uav-usable-fraction-v1"
    reference_range: [0.5, 1.0]
    assumption_rationale: "A conservative 80% usable fraction leaves reserve for pump dead volume and operational cutoff in the controlled scene."
    selection_rule: "Use the midpoint of the declared sensitivity range for the main run; vary 0.6, 0.8 and 1.0 in sensitivity."
    sensitivity_levels: [0.6, 0.8, 1.0]
    status: provisional
    scope: main
  uav_speed:
    symbol: v_i
    meaning: "UAV ground speed used for endurance and rendezvous estimates"
    value: 1.0
    unit: m/s
    min: 0.2
    max: 10.0
    source_type: manual
    source_id: "DJI-T40-official-spec"
    source_value: 7.0
    source_unit: m/s
    conversion: "value = source_value / 7 speed_scale"
    status: provisional
    scope: main
  vehicle_inventory:
    symbol: Q_v_0
    meaning: "initial pesticide inventory carried by one support vehicle"
    value: 5.0
    unit: L
    min: 0.5
    max: 20.0
    source_type: manual
    source_id: "DigitalAgro-DroneFiller-public-spec"
    source_value: 500.0
    source_unit: L
    conversion: "value = source_value * 0.01 scene_liquid_scale; vehicle match remains to be confirmed"
    status: provisional_reference_range
    scope: main
  vehicle_transfer_rate:
    symbol: rho_svc
    meaning: "vehicle-to-UAV pesticide transfer rate"
    value: 0.02
    unit: L/s
    min: 0.005
    max: 0.2
    source_type: manual
    source_id: "Frost-DroneMAX-public-spec"
    source_value: 0.7568
    source_unit: L/s
    conversion: "value = source_value * 0.02643 scene_flow_scale; timed pump test remains to be completed"
    status: provisional_reference_range
    scope: main
  vehicle_service_capacity:
    symbol: q_svc_max
    meaning: "maximum pesticide volume transferred in one service batch"
    value: 0.8
    unit: L
    min: 0.1
    max: 20.0
    source_type: manual
    source_id: "DigitalAgro-DroneFiller-public-spec"
    source_value: 500.0
    source_unit: L
    conversion: "value = min(source_value * 0.01 scene_liquid_scale, uav_onboard_pesticide * uav_usable_fraction); one service batch fills at most one UAV"
    status: provisional_reference_range
    scope: main
  service_setup_time:
    symbol: T_setup
    meaning: "fixed preparation time before pesticide transfer"
    value: 10.0
    unit: s
    min: 1.0
    max: 120.0
    source_type: assumption
    source_id: "pending-equipment-or-field-source"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-service-setup-v1"
    reference_range: [1.0, 120.0]
    assumption_rationale: "Ten seconds represents a short but nonzero connection and preparation interval in a discrete service model."
    selection_rule: "Use the lower-middle operating point and vary 5, 10 and 20 seconds in sensitivity."
    sensitivity_levels: [5.0, 10.0, 20.0]
    status: provisional
    scope: main
  request_safety_margin:
    symbol: Delta_T_safe
    meaning: "time margin used by the dynamic replenishment-request trigger"
    value: 10.0
    unit: s
    min: 0.0
    max: 60.0
    source_type: assumption
    source_id: "controlled-scene-assumption-request-safety-margin-v1"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-request-safety-margin-v1"
    reference_range: [0.0, 60.0]
    assumption_rationale: "Ten seconds provides a bounded forecast-error buffer without exceeding the 80 s nominal spray endurance."
    selection_rule: "Use 10 s in the main run and vary 0, 10 and 20 s in sensitivity."
    sensitivity_levels: [0.0, 10.0, 20.0]
    status: provisional
    scope: main
  rendezvous_radius:
    symbol: R_rv
    meaning: "maximum UAV-vehicle separation accepted for service"
    value: 5.0
    unit: m
    min: 1.0
    max: 30.0
    source_type: assumption
    source_id: "pending-equipment-or-field-source"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-rendezvous-radius-v1"
    reference_range: [1.0, 30.0]
    assumption_rationale: "Five metres represents a bounded ground-to-air service envelope while keeping the vehicle on the road graph."
    selection_rule: "Use the central operating point and vary 3, 5 and 10 metres in sensitivity."
    sensitivity_levels: [3.0, 5.0, 10.0]
    status: provisional
    scope: main
  vehicle_speed:
    symbol: v_v
    meaning: "support-vehicle road speed"
    value: 1.0
    unit: m/s
    min: 0.2
    max: 10.0
    source_type: assumption
    source_id: "pending-equipment-or-field-source"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-vehicle-speed-v1"
    reference_range: [0.2, 10.0]
    assumption_rationale: "One metre per second is a conservative effective speed after road curvature and low-speed rendezvous control."
    selection_rule: "Use the central operating point and vary 0.5, 1.0 and 2.0 metres per second in sensitivity."
    sensitivity_levels: [0.5, 1.0, 2.0]
    status: provisional
    scope: main
  decision_dt:
    symbol: Delta_t
    meaning: "environment decision interval"
    value: 1.0
    unit: s
    min: 0.1
    max: 10.0
    source_type: assumption
    source_id: "pending-equipment-or-field-source"
    source_value: null
    source_unit: null
    conversion: null
    simulation_source_id: "controlled-scene-assumption-decision-step-v1"
    reference_range: [0.1, 10.0]
    assumption_rationale: "One second resolves service setup, transfer and road travel while keeping the explicit field update stable at all scales."
    selection_rule: "Use one second as the common decision interval; do not vary it in the main causal experiments."
    sensitivity_levels: [0.5, 1.0, 2.0]
    status: provisional
    scope: main
